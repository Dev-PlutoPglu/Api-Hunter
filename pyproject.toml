[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api-hunter"
version = "1.1.0"
description = "Hunt free APIs from GitHub & the internet, reverse-engineer hidden APIs from websites & APKs, then test every endpoint — terminal + premium SaaS dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "API Hunter contributors" }]
keywords = [
    "api", "api-hunter", "public-apis", "openapi", "swagger",
    "reverse-engineering", "apk", "cli", "dashboard", "nextjs",
    "tailwind", "web-scraping", "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
ui = ["rich>=13.0"]
yaml = ["PyYAML>=6.0"]
all = ["rich>=13.0", "PyYAML>=6.0"]

[project.scripts]
apihunter = "apihunter.cli:main"

[project.urls]
Homepage = "https://github.com/Dev-PlutoPglu/api-hunter"
Documentation = "https://github.com/Dev-PlutoPglu/api-hunter/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/Dev-PlutoPglu/api-hunter/issues"
Changelog = "https://github.com/Dev-PlutoPglu/api-hunter/blob/main/docs/ARCHITECTURE.md"

[tool.setuptools]
packages = ["apihunter"]
include-package-data = true

[tool.ruff]
line-length = 100
target-version = "py39"
