version: "3.8"
services:
  api-hunter:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - ./apihunter_out:/app/apihunter_out
    env_file: .env
  dashboard-premium:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./dashboard-premium:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api-hunter
