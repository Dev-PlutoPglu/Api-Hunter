name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Compile check
        run: python -m compileall -q apihunter apihunter.py

      - name: CLI smoke test (offline catalog hunt)
        run: |
          python apihunter.py run -s builtin -k cat -n 5 -w 5 --no-color -o ci_out

      - name: CLI smoke test (discover + report on saved file)
        run: |
          python apihunter.py discover -s builtin -n 10 -o ci_out
          python apihunter.py report ci_out/catalog.json -o ci_out2

      - name: APK reverse-engineering smoke test
        run: |
          python tools/make_test_apk.py
          python apihunter.py reverse-apk tools/synthetic-app.apk --no-test -o ci_apk

      - name: Web dashboard boots and serves
        run: |
          python apihunter.py ui --port 8791 --no-browser &
          UI_PID=$!
          sleep 4
          curl --fail --silent http://127.0.0.1:8791/api/state
          curl --fail --silent http://127.0.0.1:8791/ | grep -q "API Hunter"
          kill $UI_PID
